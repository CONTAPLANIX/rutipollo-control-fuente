function calcIngresos(r){

function calcEgresos(r){

  });

function unidadDe(nombre){ var k = normalizar(nombre); var p = S.productos.find(function(x){ return normalizar(x.nombre)===k; }); return (p && p.unidad) ? String(p.unidad) : "kg"; }

  var docId = id || genId("eg");

    Object.assign(mm, cm); S.db.collection("egresos").doc(mm.id).set(cm, { merge:true }).catch(function(e){ console.error(e); }); });

function proveedorDe(e){ if(e.proveedor && e.proveedor.razonSocial) return String(e.proveedor.razonSocial); var d = String(e.descripcion||"").replace(/\s*·\s*[A-Z0-9]+-\d+.*$/i, "").replace(/^Compra de\s+/i, "").trim(); if(!d || (e.kardex && normalizar(d)===normalizar(e.kardex.producto))) return "(sin proveedor)"; return d; }
function calcCompras(r){
  var lista = [], mermasPorCompra = {};
  Object.keys(S.egresos).forEach(function(id){ var e = S.egresos[id]; if(e.eliminado) return; if(e.tipo==="merma" && e.compraId){ mermasPorCompra[e.compraId] = (mermasPorCompra[e.compraId]||0) + num(e.kardex ? e.kardex.kg : 0); } });
  Object.keys(S.egresos).forEach(function(id){ var e = S.egresos[id]; if(e.eliminado || e.tipo!=="gasto" || !e.kardex || !e.kardex.producto) return; var f = String(e.fecha||"").slice(0,10); if(f < r.desde || f > r.hasta) return;
    lista.push({ e:e, fecha:f, proveedor:proveedorDe(e), producto:String(e.kardex.producto), kg:num(e.kardex.kg), monto:num(e.monto), unidad:unidadDe(e.kardex.producto), merma:mermasPorCompra[e.id]||0 }); });
  lista.sort(function(a,b){ return (a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0) || (num(b.e.creadoEn)-num(a.e.creadoEn)); });
  var porProd = {}, porProv = {};
  lista.forEach(function(c){ var k = normalizar(c.producto); var g = porProd[k] || (porProd[k] = { nombre:c.producto, kg:0, monto:0, n:0, merma:0, unidad:c.unidad }); g.kg += c.kg; g.monto += c.monto; g.n++; g.merma += c.merma;
    var kp = normalizar(c.proveedor); var gp = porProv[kp] || (porProv[kp] = { nombre:c.proveedor, kg:0, monto:0, n:0, ultima:"" }); gp.kg += c.kg; gp.monto += c.monto; gp.n++; if(c.fecha > gp.ultima) gp.ultima = c.fecha; });
  return { lista:lista, total:lista.reduce(function(s,c){ return s+c.monto; }, 0), kg:lista.reduce(function(s,c){ return s+c.kg; }, 0), merma:lista.reduce(function(s,c){ return s+c.merma; }, 0),
    porProd:Object.keys(porProd).map(function(k){ return porProd[k]; }).sort(function(a,b){ return b.monto-a.monto; }), porProv:Object.keys(porProv).map(function(k){ return porProv[k]; }).sort(function(a,b){ return b.monto-a.monto; }) };
}

function calcTinas(r){

  Object.keys(S.tinas).forEach(function(id){ var t = S.tinas[id]; if(t.eliminado) return;
    var n = Math.round(num(t.cantidad)), f = String(t.fecha||"").slice(0,10), enPer = f >= r.desde && f <= r.hasta;
    if(t.tipo==="baja"){ // malograda / perdida: sale del total del negocio; si estaba con un cliente, ya no se le espera
      bajasTot += n; if(enPer){ lista.push(t); bajP += n; }
      if(t.cliente){ var gb = grupo(t.cliente); gb.movs.push({ f:f, c:num(t.creadoEn), n:-n }); gb.bajas += n; }
      return; }
    var g = grupo(t.cliente); g.movs.push({ f:f, c:num(t.creadoEn), n:t.tipo==="entrada" ? -n : n });
    if(t.tipo==="entrada"){ g.entradas += n; if(f > g.ultimaEntrada) g.ultimaEntrada = f; } else { g.salidas += n; if(f > g.ultimaSalida) g.ultimaSalida = f; }
    if(enPer){ lista.push(t); if(t.tipo==="entrada") entP += n; else salP += n; } });
  var porCliente = Object.keys(porC).map(function(k){ var g = porC[k]; g.movs.sort(function(a,b){ return (a.f<b.f?-1:a.f>b.f?1:0) || (a.c-b.c); }); var saldo = 0; g.movs.forEach(function(m){ var antes = saldo; saldo += m.n; if(antes <= 0 && saldo > 0) g.desde = m.f; }); g.saldo = saldo; if(saldo <= 0) g.desde = ""; return g; }).sort(function(a,b){ return (b.saldo-a.saldo) || (a.cliente<b.cliente?-1:1); });

  if(action==="rec-agregar"){ var rd = document.getElementById("rec-desc").value.trim(), rm = r2(document.getElementById("rec-monto").value), rdia = Math.max(1, Math.min(31, Number(document.getElementById("rec-dia").value)||1)); if(!rd || !(rm > 0)){ toast("Escriba la descripción y el monto"); return; } var lista = (S.config.recurrentes||[]).slice(); var rcu = Math.max(0, Math.round(num((document.getElementById("rec-cuotas")||{}).value))); lista.push({ id:genId("rc"), descripcion:rd, categoria:document.getElementById("rec-cat").value, monto:rm, dia:rdia, metodo:document.getElementById("rec-metodo").value, cuotas:rcu || null }); S.config.recurrentes = lista; S.db.doc("control/config").set({ recurrentes:lista, actualizadoEn:Date.now(), por:S.user.nombre }, { merge:true }).then(function(){ toast("Gasto fijo agregado"); }).catch(function(){ toast("No se pudo guardar: revisa tu internet"); }); render(); return; }
  if(action==="rec-quitar"){ if(!confirm("¿Quitar este gasto fijo? Los gastos ya registrados no se borran.")) return; var l2 = (S.config.recurrentes||[]).filter(function(x){ return x.id!==id; }); S.config.recurrentes = l2; S.db.doc("control/config").set({ recurrentes:l2, actualizadoEn:Date.now(), por:S.user.nombre }, { merge:true }).catch(function(){}); render(); return; }
  if(action==="merc-prod"){ UI.mercProd = val||""; render(); return; }
  if(action==="nueva-tina"){ abrirFormTina(val||"salida", t.getAttribute("data-cliente")||""); return; }

  if(action==="guardar-tina"){ guardarTina(); return; }

  if(action==="may-agregar"){ var mc = document.getElementById("may-cliente").value.trim(), mt = r2(document.getElementById("may-tope").value); if(!mc || !(mt > 0)){ toast("Escriba el cliente y el tope"); return; } var ml = (S.config.mayoristas||[]).filter(function(x){ return normalizar(x.cliente)!==normalizar(mc); }); ml.push({ id:genId("my"), cliente:mc.toUpperCase(), tope:mt, telefono:String((document.getElementById("may-tel")||{}).value||"").replace(/\D/g,"") }); guardarListaConfig("mayoristas", ml, "Mayorista guardado"); return; }

  if(action==="guardar-alertas"){ guardarConfig("alertas", { cajaDif:r2(document.getElementById("al-caja").value), deudaCliente:r2(document.getElementById("al-deuda").value), stockMin:r2(document.getElementById("al-stock").value), tinasDias:Math.max(0, Math.round(num(document.getElementById("al-tinas").value))) }); return; }
  if(action==="instalar-app"){ if(window.__instalar){ window.__instalar.prompt(); window.__instalar.userChoice.then(function(){ window.__instalar = null; render(); }).catch(function(){}); } return; }
  if(action==="vivo-sonido"){ VIVO.sonido = !VIVO.sonido; lsSet("sonido", VIVO.sonido); if(VIVO.sonido){ vivoAudio(); sonar(); } t.textContent = VIVO.sonido ? "🔊 Sonido: sí" : "🔇 Sonido: no"; return; }
  if(action==="cat-agregar"){ var nv = document.getElementById("cat-nueva").value.trim(); if(!nv) return; if(S.categorias.some(function(c){ return normalizar(c)===normalizar(nv); })){ toast("Esa categoría ya existe"); return; } S.categorias.push(nv); guardarCategorias(); return; }
  if(action==="cat-quitar"){ var i = Number(val); if(S.categorias.length <= 1){ toast("Debe quedar al menos una categoría"); return; } if(!confirm("¿Quitar la categoría \""+S.categorias[i]+"\"?")) return; S.categorias.splice(i, 1); guardarCategorias(); return; }
  if(action==="cat-renombrar"){ var j = Number(val); var nn = prompt("Nuevo nombre de la categoría:", S.categorias[j]); if(nn===null) return; nn = nn.trim(); if(!nn) return; S.categorias[j] = nn; guardarCategorias(); return; }
  if(action==="cat-subir"){ var k = Number(val); if(k <= 0) return; var tmp = S.categorias[k-1]; S.categorias[k-1] = S.categorias[k]; S.categorias[k] = tmp; guardarCategorias(); return; }
  if(action==="cambiar-pass"){ abrirCambiarPass(); return; }
  if(action==="guardar-pass"){ guardarPass(); return; }

  if(action==="gate-otro"){ UI.gateNombre = ""; UI.gateEscribir = false; UI.gateError = ""; renderGate(); return; }

document.addEventListener("submit", function(ev){ if(ev.target && ev.target.id==="gate-form"){ ev.preventDefault(); confirmarLogin(); } });
document.addEventListener("change", function(ev){
  var el = ev.target, id = el.id;
  if(id==="per-anio"){ UI.per.anio = Number(el.value); asegurarAnios(); render(); }
  else if(id==="per-mes"){ UI.per.mes = Number(el.value); render(); }
  else if(id==="per-dia"){ if(el.value){ UI.per.dia = el.value; asegurarAnios(); render(); } }
  else if(id==="per-desde"){ if(el.value){ UI.per.desde = el.value; asegurarAnios(); render(); } }
  else if(id==="per-hasta"){ if(el.value){ UI.per.hasta = el.value; asegurarAnios(); render(); } }
  else if(id==="gastos-cat"){ UI.gastosCat = el.value; render(); }
  else if(id==="merc-prod"){ UI.mercProd = el.value; render(); }
  else if(id==="rec-fecha"){ if(el.value){ if(el.closest(".modal")) abrirRecorridos(el.value, UI.recVend||""); else { UI.recFecha = el.value; asegurarAnios(); render(); } } }
  else if(id==="rec-vend"){ if(el.closest(".modal")) abrirRecorridos(UI.recFecha||todayISO(), el.value); else { UI.recVend = el.value; render(); } }
  else if(id==="caja-dia"){ if(el.value){ UI.cajaDia = el.value; UI.cajaReal = ""; UI.cajaNota = ""; UI.cajaConteo = null; asegurarAnios(); cargarAnio(Number(el.value.slice(0,4)), false); render(); } }
});
document.addEventListener("input", function(ev){
  var el = ev.target, id = el.id;
  if(id==="merc-buscar"){ UI.mercBuscar = el.value; clearTimeout(window.__mq); window.__mq = setTimeout(function(){ render(); var b = document.getElementById("merc-buscar"); if(b){ b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }, 350); }
  else if(id==="gastos-buscar"){ UI.gastosBuscar = el.value; var tb = document.querySelector(".main"); clearTimeout(window.__bq); window.__bq = setTimeout(function(){ render(); var b = document.getElementById("gastos-buscar"); if(b){ b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }, 350); }
  else if(id==="caja-real"){ UI.cajaReal = el.value; if(UI.cajaConteo && Math.abs(r2(el.value) - conteoTotal(UI.cajaConteo)) > 0.009) UI.cajaConteo = null; clearTimeout(window.__cq); window.__cq = setTimeout(function(){ render(); var r = document.getElementById("caja-real"); if(r){ r.focus(); } }, 600); }
  else if(id==="caja-nota"){ UI.cajaNota = el.value; }
  else if(id==="vivo-vol"){ VIVO.volumen = num(el.value); lsSet("volumen", VIVO.volumen); if(VIVO.master) VIVO.master.gain.value = VIVO.volumen; }
  else if(el.classList && el.classList.contains("den-cant")){ conteoPintar(); }
});
document.addEventListener("keydown", function(ev){ if(ev.key==="Escape") closeOverlay(); });
document.addEventListener("fullscreenchange", function(){ if(!document.fullscreenElement && document.body.classList.contains("tv")){ document.body.classList.remove("tv"); } setTimeout(function(){ if(typeof vivoLayout==="function") vivoLayout(); }, 300); });
window.addEventListener("online", function(){ S.online = true; if(S.user) render(); });

window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); window.__instalar = e; if(S.user && UI.vista==="ajustes") render(); });
if("serviceWorker" in navigator && location.protocol !== "file:"){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
function iniciar(){
  if(!window.firebase || !window.RUTIPOLLO_FIREBASE_CONFIG){ document.getElementById("app").innerHTML = '<div class="gate"><h1>'+CFG.titulo+'</h1><div class="note danger">No se pudo cargar la conexión. Revisa tu internet y vuelve a abrir la página.</div></div>'; return; }
  if(!firebase.apps.length) firebase.initializeApp(window.RUTIPOLLO_FIREBASE_CONFIG);
  S.db = firebase.firestore();
  try{ S.db.enablePersistence({ synchronizeTabs:true }).catch(function(e){ console.warn("sin caché local", e && e.code); }); }catch(e){}
  UI.gateMode = "cargando"; renderGate();
  S.db.doc("publico/nombres").onSnapshot(function(snap){ var d = snap.exists ? snap.data() : null; S.nombres = (d && Array.isArray(d.nombres)) ? d.nombres : []; if(!S.user && UI.gateMode==="login") renderGate(); }, function(){});
  S.db.doc("servicio/estado").onSnapshot(function(snap){ S.servicio = snap.exists ? (snap.data()||{}) : {}; if(!S.user) renderGate(); else render(); }, function(){});
  var primero = true;
  firebase.auth().onAuthStateChanged(function(u){
    if(u){ alEntrar(u); }
    else if(primero || S.user){ if(S.user){ S.user = null; } UI.gateMode = "login"; renderGate(); }
    primero = false;
  });
}
iniciar();
})();
