<script>
(function(){
"use strict";
var APP_VERSION = "18 oct · C10";
// Celulares antiguos: roundRect y ellipse no existen en su navegador; se dibujan a mano.
try{
  var CRC = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if(CRC && !CRC.roundRect) CRC.roundRect = function(x,y,w,h,r){ r = Math.max(0, Math.min(Number(r)||0, w/2, h/2)); this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this; };
  if(CRC && !CRC.ellipse) CRC.ellipse = function(x,y,rx,ry,rot,a0,a1){ this.save(); this.translate(x,y); this.scale(rx, ry); this.arc(0,0,1,a0,a1); this.restore(); return this; };
}catch(e){}
var CFG = { nombre:"Rico Pollo Dissur", titulo:"Rico Pollo - Dissur", dominio:"rutipollo.app", prefijo:"lrc", app:"Rutipollo" };
var CATEGORIAS_BASE = ["Compra de pollo","Transporte / combustible","Sueldos","Alquiler","Servicios","Insumos","Otros"];
var METODOS = ["efectivo","banco","yape","plin"];
var MOTIVOS_MERMA = ["Malogrado / descompuesto","Vencido","Devolución de cliente","Robo o pérdida","Peso de menos del proveedor","Otro"];
var MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
var MESES_ABR = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var DIAS_ABR = ["dom","lun","mar","mié","jue","vie","sáb"];

// ---------- iconos de linea (SVG, un solo color) ----------
var ICONOS = {
  tablero:'<path d="M4 20V10M10 20V4M16 20v-7M2 20h20"/>',
  envivo:'<circle cx="12" cy="12" r="2.5"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/>',
  gastos:'<path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4"/>',
  kardex:'<path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>',
  caja:'<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7V5a2 2 0 0 1 2-2h11v4"/><circle cx="16" cy="14" r="1.5"/>',
  avisos:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
  ajustes:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  sol:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  luna:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  salir:'<path d="M10 4H5v16h5M14 8l4 4-4 4M8 12h10"/>',
  mapa:'<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/>',
  tv:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'
};
function ico(n){ return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONOS[n]||"")+'</svg>'; }
// ---------- utilidades ----------
function todayISO(){ var d = new Date(); var local = new Date(d.getTime() - d.getTimezoneOffset()*60000); return local.toISOString().slice(0,10); }
function pad(n){ return String(n).padStart(2,"0"); }
function num(n){ n = Number(n); return isFinite(n) ? n : 0; }
function r2(n){ return Math.round(num(n)*100)/100; }
function fmt(n){ return "S/ " + num(n).toLocaleString("es-PE", { minimumFractionDigits:2, maximumFractionDigits:2 }); }
function n2(n){ return num(n).toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 }); }
function kgTxt(n){ n = num(n); return n.toLocaleString("es-PE", { minimumFractionDigits:0, maximumFractionDigits:2 }); }
function pct(a, b){ return b ? (a/b*100) : 0; }
function pctTxt(p){ return (isFinite(p) ? p.toFixed(1) : "0.0") + " %"; }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function parseFecha(f){ var p = String(f||"").split("-").map(Number); return { anio:p[0]||0, mes:p[1]||0, dia:p[2]||0 }; }
function fechaDisplay(f){ if(!f) return ""; var p = parseFecha(f); return p.dia + " " + MESES_ABR[p.mes-1] + " " + p.anio; }
function fechaCorta(f){ var p = parseFecha(f); return p.dia + " " + MESES_ABR[p.mes-1]; }
function diaSemana(f){ var p = parseFecha(f); return DIAS_ABR[new Date(p.anio, p.mes-1, p.dia).getDay()]; }
function isoDe(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function isoAdd(f, dias){ var p = parseFecha(f); var d = new Date(p.anio, p.mes-1, p.dia + dias); return isoDe(d); }
function diasEntre(a, b){ var pa = parseFecha(a), pb = parseFecha(b); return Math.round((new Date(pb.anio,pb.mes-1,pb.dia) - new Date(pa.anio,pa.mes-1,pa.dia)) / 86400000); }
function lunesDe(f){ var p = parseFecha(f); var d = new Date(p.anio, p.mes-1, p.dia); var dow = (d.getDay()+6)%7; return isoAdd(f, -dow); }
function ultimoDia(anio, mes){ return new Date(anio, mes, 0).getDate(); }
function genId(prefix){ return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7); }
function metodoK(m){ return (m==="banco"||m==="yape"||m==="plin") ? m : "efectivo"; }
function metodoLabel(m){ return m==="banco" ? "Banco" : m==="yape" ? "Yape" : m==="plin" ? "Plin" : m==="mixto" ? "Mixto" : "Efectivo"; }
function normalizar(s){ return String(s||"").trim().toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," "); }
function numNota(v){ return (v && v.serie ? v.serie + "-" : "") + String((v && v.correlativo) || 0).padStart(6, "0"); }
function emailDeNombre(nombre){ var base = String(nombre||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,""); return base ? base+"@"+CFG.dominio : ""; }
function lsGet(k, def){ try{ var v = localStorage.getItem(CFG.prefijo+"_"+k); return v===null ? def : JSON.parse(v); }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(CFG.prefijo+"_"+k, JSON.stringify(v)); }catch(e){} }
var toastTimer = null;
function toast(msg){ var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2600); }

// Notas de la app: mismas reglas que en Rutipollo (notas antiguas sin "pagado" = contado ya pagado).
function estaPagado(v){ return v.pagado !== false; }
function abonosEfectivos(v){ if(v.abonos && v.abonos.length) return v.abonos; if(v.pagado && v.fechaPago) return [{ monto:v.total, metodo:v.metodoPago, fecha:v.fechaPago }]; return []; }
function montoAbonado(v){ return abonosEfectivos(v).reduce(function(s,a){ return s + num(a.monto); }, 0); }
function saldoPendiente(v){ if(v.tipoPago!=="credito" || v.pagado) return 0; var s = num(v.total) - montoAbonado(v); return s > 0.009 ? r2(s) : 0; }
function estaPendiente(v){ return v.tipoPago==="credito" && saldoPendiente(v) > 0; }

// ---------- estado ----------
var hoy = todayISO(), hp = parseFecha(hoy);
var CONFIG_BASE = { alertas:{ deudaCliente:500, stockMin:100, cajaDif:20 }, metas:{ venta:0, utilidad:0 } };
var S = { db:null, user:null, ventas:{}, egresos:{}, productos:[], categorias:CATEGORIAS_BASE.slice(), config:JSON.parse(JSON.stringify(CONFIG_BASE)), cierres:{}, nombres:[], aniosCargados:{}, unsubs:[], servicio:{}, listo:false, online:navigator.onLine };
var UI = { vista:"tablero", per:{ tipo:"mes", anio:hp.anio, mes:hp.mes, dia:hoy, desde:hoy.slice(0,8)+"01", hasta:hoy },
  utilBase: lsGet("utilBase","cobrado"), gastosCat:"", gastosBuscar:"", verEliminados:false, kardexProd:"", cajaDia:hoy, cajaReal:"", cajaNota:"",
  gateNombre:"", gateError:"", gateEscribir:false, gateCargando:false, gateMode:"login" };

// ---------- tema claro / oscuro ----------
function temaActual(){ var t = document.documentElement.getAttribute("data-theme"); if(t) return t; return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
function aplicarTema(t){ if(t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); var m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", temaActual()==="dark" ? "#0e1620" : "#092d58"); }
aplicarTema(lsGet("tema", null));
// ---------- periodo ----------
function periodo(){
  var p = UI.per, h = todayISO();
  if(p.tipo==="hoy") return { tipo:"hoy", desde:h, hasta:h, titulo:"Hoy, "+diaSemana(h)+" "+fechaDisplay(h) };
  if(p.tipo==="dia") return { tipo:"dia", desde:p.dia, hasta:p.dia, titulo:diaSemana(p.dia)+" "+fechaDisplay(p.dia) };
  if(p.tipo==="semana"){ var l = lunesDe(h); return { tipo:"semana", desde:l, hasta:h, titulo:"Esta semana (del "+fechaDisplay(l)+" al "+fechaDisplay(h)+")" }; }
  if(p.tipo==="mes"){ return { tipo:"mes", desde:p.anio+"-"+pad(p.mes)+"-01", hasta:p.anio+"-"+pad(p.mes)+"-"+pad(ultimoDia(p.anio,p.mes)), titulo:MESES[p.mes-1]+" "+p.anio }; }
  if(p.tipo==="anio") return { tipo:"anio", desde:p.anio+"-01-01", hasta:p.anio+"-12-31", titulo:"Año "+p.anio };
  var de = p.desde || h, ha = p.hasta || h; if(de > ha){ var t = de; de = ha; ha = t; }
  return { tipo:"rango", desde:de, hasta:ha, titulo:"Del "+fechaDisplay(de)+" al "+fechaDisplay(ha) };
}
function periodoAnterior(r){
  if(r.tipo==="mes"){ var a = UI.per.anio, m = UI.per.mes-1; if(m<1){ m = 12; a--; } return { desde:a+"-"+pad(m)+"-01", hasta:a+"-"+pad(m)+"-"+pad(ultimoDia(a,m)), titulo:MESES[m-1]+" "+a, nombre:"mes anterior" }; }
  if(r.tipo==="anio"){ var y = UI.per.anio-1; return { desde:y+"-01-01", hasta:y+"-12-31", titulo:"Año "+y, nombre:"año anterior" }; }
  if(r.tipo==="semana"){ var l = isoAdd(r.desde,-7); return { desde:l, hasta:isoAdd(l,6), titulo:"Semana del "+fechaDisplay(l), nombre:"semana anterior (completa)" }; }
  if(r.tipo==="hoy" || r.tipo==="dia"){ var d = isoAdd(r.desde,-1); return { desde:d, hasta:d, titulo:diaSemana(d)+" "+fechaDisplay(d), nombre:"día anterior" }; }
  var n = diasEntre(r.desde, r.hasta)+1; return { desde:isoAdd(r.desde,-n), hasta:isoAdd(r.desde,-1), titulo:"Del "+fechaDisplay(isoAdd(r.desde,-n))+" al "+fechaDisplay(isoAdd(r.desde,-1)), nombre:n+" días anteriores" };
}
function aniosDe(r){ var out = []; for(var a = Number(r.desde.slice(0,4)); a <= Number(r.hasta.slice(0,4)); a++) out.push(a); return out; }

// ---------- calculos ----------
function calcIngresos(r){
  var out = { vendido:0, notas:0, cobrado:{efectivo:0,banco:0,yape:0,plin:0,total:0}, deudas:{efectivo:0,banco:0,yape:0,plin:0,total:0,n:0}, porCobrar:0, porDia:{}, porVendedor:{}, kgPorProd:{}, lista:[] };
  function dia(f){ return out.porDia[f] || (out.porDia[f] = { vendido:0, cobrado:0, efectivo:0, banco:0, yape:0, plin:0, notas:0, deudas:0 }); }
  function cobro(f, metodo, monto, esDeuda){ var k = metodoK(metodo); out.cobrado[k] += monto; out.cobrado.total += monto; var d = dia(f); d.cobrado += monto; d[k] += monto; if(esDeuda){ out.deudas[k] += monto; out.deudas.total += monto; out.deudas.n++; d.deudas += monto; } }
  Object.keys(S.ventas).forEach(function(id){
    var v = S.ventas[id]; if(v.eliminado) return;
    var f = String(v.fecha||"").slice(0,10); var enPer = f >= r.desde && f <= r.hasta;
    if(enPer){
      out.vendido += num(v.total); out.notas++; var d = dia(f); d.vendido += num(v.total); d.notas++; out.lista.push(v);
      var vk = v.vendedor || "(sin vendedor)"; out.porVendedor[vk] = (out.porVendedor[vk]||0) + num(v.total);
      if(estaPendiente(v)) out.porCobrar += saldoPendiente(v);
    }
    if(v.tipoPago==="credito"){
      abonosEfectivos(v).forEach(function(a){ var fa = String(a.fecha||"").slice(0,10); if(fa < r.desde || fa > r.hasta) return; cobro(fa, a.metodo, num(a.monto), true); });
    } else if(enPer && estaPagado(v)){
      if(Array.isArray(v.abonos) && v.abonos.length) v.abonos.forEach(function(a){ cobro(f, a.metodo, num(a.monto), false); });
      else cobro(f, v.metodoPago, num(v.total), false);
    }
  });
  return out;
}
function calcEgresos(r){
  var out = { total:0, n:0, porCat:{}, porMetodo:{efectivo:0,banco:0,yape:0,plin:0}, porDia:{}, lista:[] };
  Object.keys(S.egresos).forEach(function(id){
    var e = S.egresos[id]; if(e.eliminado || e.tipo==="ajuste" || e.tipo==="merma") return;
    var f = String(e.fecha||"").slice(0,10); if(f < r.desde || f > r.hasta) return;
    var m = num(e.monto); out.total += m; out.n++;
    var c = e.categoria || "Otros"; out.porCat[c] = (out.porCat[c]||0) + m;
    out.porMetodo[metodoK(e.metodo)] += m; out.porDia[f] = (out.porDia[f]||0) + m; out.lista.push(e);
  });
  out.lista.sort(function(a,b){ return (a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0) || (num(b.creadoEn)-num(a.creadoEn)); });
  return out;
}
function calcResumen(r){
  var ing = calcIngresos(r), eg = calcEgresos(r);
  var base = UI.utilBase==="vendido" ? ing.vendido : ing.cobrado.total;

function comprimirImagen(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ var img = new Image(); img.onload = function(){
      var max = 1000, w = img.width, h = img.height; if(w > max || h > max){ var k = max/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
      var c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
      var url = c.toDataURL("image/jpeg", 0.72);
      if(url.length > 650000) url = c.toDataURL("image/jpeg", 0.5);
      if(url.length > 650000){ var c2 = document.createElement("canvas"); c2.width = Math.round(w*0.6); c2.height = Math.round(h*0.6); c2.getContext("2d").drawImage(img, 0, 0, c2.width, c2.height); url = c2.toDataURL("image/jpeg", 0.5); }
      res(url); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

  if(action==="quitar-mov"){ var mv = S.egresos[id]; if(mv && confirm("¿Quitar este movimiento del Kardex ("+(mv.tipo==="merma"?"merma":"ajuste")+" de "+kgTxt(mv.kardex?mv.kardex.kg:0)+")?")){ eliminarGasto(id, true, true); } return; }
  if(action==="guardar-ajuste"){ guardarAjuste(); return; }
  if(action==="caja-hoy"){ UI.cajaDia = todayISO(); UI.cajaReal = ""; UI.cajaNota = ""; render(); return; }
  if(action==="caja-ver"){ UI.cajaDia = val; UI.cajaReal = ""; UI.cajaNota = ""; render(); return; }
  if(action==="guardar-cierre"){ guardarCierre(); return; }
  if(action==="guardar-metas"){ guardarConfig("metas", { venta:r2(document.getElementById("meta-venta").value), utilidad:r2(document.getElementById("meta-utilidad").value) }); return; }
  if(action==="guardar-alertas"){ guardarConfig("alertas", { cajaDif:r2(document.getElementById("al-caja").value), deudaCliente:r2(document.getElementById("al-deuda").value), stockMin:r2(document.getElementById("al-stock").value) }); return; }
  if(action==="instalar-app"){ if(window.__instalar){ window.__instalar.prompt(); window.__instalar.userChoice.then(function(){ window.__instalar = null; render(); }).catch(function(){}); } return; }
  if(action==="vivo-sonido"){ VIVO.sonido = !VIVO.sonido; lsSet("sonido", VIVO.sonido); if(VIVO.sonido){ vivoAudio(); sonar(); } t.textContent = VIVO.sonido ? "🔊 Sonido: sí" : "🔇 Sonido: no"; return; }
  if(action==="cat-agregar"){ var nv = document.getElementById("cat-nueva").value.trim(); if(!nv) return; if(S.categorias.some(function(c){ return normalizar(c)===normalizar(nv); })){ toast("Esa categoría ya existe"); return; } S.categorias.push(nv); guardarCategorias(); return; }
  if(action==="cat-quitar"){ var i = Number(val); if(S.categorias.length <= 1){ toast("Debe quedar al menos una categoría"); return; } if(!confirm("¿Quitar la categoría \""+S.categorias[i]+"\"?")) return; S.categorias.splice(i, 1); guardarCategorias(); return; }
  if(action==="cat-renombrar"){ var j = Number(val); var nn = prompt("Nuevo nombre de la categoría:", S.categorias[j]); if(nn===null) return; nn = nn.trim(); if(!nn) return; S.categorias[j] = nn; guardarCategorias(); return; }
  if(action==="cat-subir"){ var k = Number(val); if(k <= 0) return; var tmp = S.categorias[k-1]; S.categorias[k-1] = S.categorias[k]; S.categorias[k] = tmp; guardarCategorias(); return; }
  if(action==="cambiar-pass"){ abrirCambiarPass(); return; }
  if(action==="guardar-pass"){ guardarPass(); return; }
  if(action==="cerrar-sesion"){ cerrarSesion(); return; }
  if(action==="gate-nombre"){ UI.gateNombre = val; UI.gateError = ""; renderGate(); return; }
  if(action==="gate-escribir"){ UI.gateEscribir = true; UI.gateError = ""; renderGate(); return; }
  if(action==="gate-otro"){ UI.gateNombre = ""; UI.gateEscribir = false; UI.gateError = ""; renderGate(); return; }
});
document.addEventListener("submit", function(ev){ if(ev.target && ev.target.id==="gate-form"){ ev.preventDefault(); confirmarLogin(); } });
document.addEventListener("change", function(ev){
  var el = ev.target, id = el.id;
  if(id==="per-anio"){ UI.per.anio = Number(el.value); asegurarAnios(); render(); }
  else if(id==="per-mes"){ UI.per.mes = Number(el.value); render(); }
  else if(id==="per-dia"){ if(el.value){ UI.per.dia = el.value; asegurarAnios(); render(); } }
  else if(id==="per-desde"){ if(el.value){ UI.per.desde = el.value; asegurarAnios(); render(); } }
  else if(id==="per-hasta"){ if(el.value){ UI.per.hasta = el.value; asegurarAnios(); render(); } }
  else if(id==="gastos-cat"){ UI.gastosCat = el.value; render(); }
  else if(id==="caja-dia"){ if(el.value){ UI.cajaDia = el.value; UI.cajaReal = ""; UI.cajaNota = ""; asegurarAnios(); cargarAnio(Number(el.value.slice(0,4)), false); render(); } }
});
document.addEventListener("input", function(ev){
  var el = ev.target, id = el.id;
  if(id==="gastos-buscar"){ UI.gastosBuscar = el.value; var tb = document.querySelector(".main"); clearTimeout(window.__bq); window.__bq = setTimeout(function(){ render(); var b = document.getElementById("gastos-buscar"); if(b){ b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }, 350); }
  else if(id==="caja-real"){ UI.cajaReal = el.value; clearTimeout(window.__cq); window.__cq = setTimeout(function(){ render(); var r = document.getElementById("caja-real"); if(r){ r.focus(); } }, 600); }
  else if(id==="caja-nota"){ UI.cajaNota = el.value; }
});
document.addEventListener("keydown", function(ev){ if(ev.key==="Escape") closeOverlay(); });
document.addEventListener("fullscreenchange", function(){ if(!document.fullscreenElement && document.body.classList.contains("tv")){ document.body.classList.remove("tv"); } setTimeout(function(){ if(typeof vivoLayout==="function") vivoLayout(); }, 300); });
window.addEventListener("online", function(){ S.online = true; if(S.user) render(); });
window.addEventListener("offline", function(){ S.online = false; if(S.user) render(); });

// ---------- inicio ----------
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); window.__instalar = e; if(S.user && UI.vista==="ajustes") render(); });
if("serviceWorker" in navigator && location.protocol !== "file:"){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
function iniciar(){
  if(!window.firebase || !window.RUTIPOLLO_FIREBASE_CONFIG){ document.getElementById("app").innerHTML = '<div class="gate"><h1>'+CFG.titulo+'</h1><div class="note danger">No se pudo cargar la conexión. Revisa tu internet y vuelve a abrir la página.</div></div>'; return; }
  if(!firebase.apps.length) firebase.initializeApp(window.RUTIPOLLO_FIREBASE_CONFIG);
  S.db = firebase.firestore();
  UI.gateMode = "cargando"; renderGate();
  S.db.doc("publico/nombres").onSnapshot(function(snap){ var d = snap.exists ? snap.data() : null; S.nombres = (d && Array.isArray(d.nombres)) ? d.nombres : []; if(!S.user && UI.gateMode==="login") renderGate(); }, function(){});
  S.db.doc("servicio/estado").onSnapshot(function(snap){ S.servicio = snap.exists ? (snap.data()||{}) : {}; if(!S.user) renderGate(); else render(); }, function(){});
  var primero = true;
  firebase.auth().onAuthStateChanged(function(u){
    if(u){ alEntrar(u); }
    else if(primero || S.user){ if(S.user){ S.user = null; } UI.gateMode = "login"; renderGate(); }
    primero = false;
  });
}
iniciar();
})();
</script>
