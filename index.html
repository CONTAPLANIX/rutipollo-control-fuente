  .eq::after{ content:""; position:absolute; right:-40px; top:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(closest-side, rgba(247,98,4,.28), transparent); pointer-events:none; }

  .eq-item.ing .eq-v{ color:#8fe3ad; } .eq-item.egr .eq-v{ color:#ff9c8f; } .eq-item.uti .eq-v{ color:#fff; }

// ---------- estado ----------

// ---------- periodo ----------
function periodo(){

function periodoAnterior(r){

function comprimirImagen(file, maxPx){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ var img = new Image(); img.onload = function(){
      var max = maxPx || 1000, w = img.width, h = img.height; if(w > max || h > max){ var k = max/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
      var c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
      var url = c.toDataURL("image/jpeg", 0.72);
      if(url.length > 650000) url = c.toDataURL("image/jpeg", 0.5);
      if(url.length > 650000){ var c2 = document.createElement("canvas"); c2.width = Math.round(w*0.6); c2.height = Math.round(h*0.6); c2.getContext("2d").drawImage(img, 0, 0, c2.width, c2.height); url = c2.toDataURL("image/jpeg", 0.5); }
      res(url); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function triggerDownload(filename, blob){
  var url = URL.createObjectURL(blob); var a = document.createElement("a"); a.href = url; a.download = filename; a.style.display = "none";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

// ---------- entrar (gate) ----------
function renderGate(){
  var root = document.getElementById("app"); document.getElementById("overlay-root").innerHTML = "";
  var logo = '<img class="gate-logo" src="assets/logo.png" alt="">';
  var sv = S.servicio || {};
  if(sv.activo === false){
    root.innerHTML = '<div class="gate">'+logo+'<h1 class="section-title">'+CFG.titulo+'</h1><div class="note danger" style="max-width:380px;">'+escapeHtml(sv.mensaje || "El servicio está suspendido. Comunícate con JEED: 918 817 528.")+'</div></div>'; return;
  }
  if(UI.gateMode==="cargando"){ root.innerHTML = '<div class="gate">'+logo+'<h1 class="section-title">'+CFG.titulo+'</h1><p class="gate-note">Entrando…</p></div>'; return; }
  var nombres = S.nombres || [], elegido = UI.gateNombre || "";
  if(nombres.length && !elegido && !UI.gateEscribir){
    root.innerHTML = '<div class="gate">'+logo+'<h1 class="section-title" style="margin:0;">'+CFG.titulo+'</h1><p class="gate-note">Control interno. Solo administradoras. ¿Quién eres?</p>'
      + '<div class="user-grid">'+nombres.map(function(n){ return '<button class="user-chip" data-action="gate-nombre" data-val="'+escapeHtml(n)+'">'+escapeHtml(n)+'</button>'; }).join("")+'</div>'
      + '<div class="pin-error" id="gate-error">'+escapeHtml(UI.gateError)+'</div><button class="btn btn-sm btn-ghost" data-action="gate-escribir">Mi nombre no aparece</button></div>';
    return;
  }
  root.innerHTML = '<div class="gate">'+logo+'<h1 class="section-title" style="margin:0;">'+(elegido ? 'Hola, '+escapeHtml(elegido) : CFG.titulo)+'</h1><p class="gate-note">'+(elegido ? 'Escribe tu contraseña de la app '+CFG.app+'.' : 'Escribe tu nombre y tu contraseña de la app '+CFG.app+'.')+'</p>'
    + '<form class="gate-form" id="gate-form"><input id="gate-nombre" type="'+(elegido?'hidden':'text')+'" autocomplete="username" autocapitalize="off" placeholder="Tu nombre" maxlength="40" value="'+escapeHtml(elegido)+'"><input id="gate-password" type="password" autocomplete="current-password" placeholder="Contraseña">'
    + '<div class="pin-error" id="gate-error">'+escapeHtml(UI.gateError)+'</div><button type="submit" class="btn btn-primary" data-action="confirmar-login">Entrar</button>'+(nombres.length ? '<button type="button" class="btn btn-sm btn-ghost" data-action="gate-otro">← Elegir otro usuario</button>' : '')+'</form></div>';
  var foco = document.getElementById(elegido ? "gate-password" : "gate-nombre"); if(foco) foco.focus();
}
function confirmarLogin(){
  var nombre = (document.getElementById("gate-nombre")||{}).value || "", pass = (document.getElementById("gate-password")||{}).value || "";
  nombre = nombre.trim(); if(!nombre){ UI.gateError = "Escribe tu nombre."; renderGate(); return; } if(!pass){ UI.gateError = "Escribe tu contraseña."; renderGate(); return; }
  var email = emailDeNombre(nombre); if(!email){ UI.gateError = "El nombre debe tener letras."; renderGate(); return; }
  UI.gateNombre = nombre; UI.gateError = ""; UI.gateMode = "cargando"; renderGate();
  firebase.auth().signInWithEmailAndPassword(email, pass).catch(function(e){
    UI.gateMode = "login"; UI.gateError = (e && (e.code==="auth/wrong-password" || e.code==="auth/invalid-credential" || e.code==="auth/user-not-found" || e.code==="auth/invalid-login-credentials")) ? "Nombre o contraseña incorrectos." : (e && e.code==="auth/too-many-requests") ? "Demasiados intentos. Espera unos minutos." : "No se pudo entrar. Revisa tu internet."; renderGate();
  });
}
function cerrarSesion(){
  S.unsubs.forEach(function(u){ try{ u(); }catch(e){} }); S.unsubs = []; S.user = null; S.ventas = {}; S.egresos = {}; S.cierres = {}; S.aniosCargados = {};
  UI.gateMode = "login"; UI.gateNombre = ""; UI.gateError = "";
  firebase.auth().signOut().then(function(){ location.reload(); }, function(){ location.reload(); });
}
function alEntrar(u){
  // Solo administradoras: se comprueba el perfil en "usuarios" (el servidor también lo exige en las reglas).
  UI.gateMode = "cargando"; renderGate();
  S.db.doc("usuarios/"+u.uid).get().then(function(snap){
    var d = snap.exists ? snap.data() : null;
    if(!d || d.rol !== "admin"){ UI.gateMode = "login"; UI.gateError = d ? "Esta página es solo para administradoras." : "Tu usuario no está autorizado."; UI.gateNombre = ""; firebase.auth().signOut(); renderGate(); return; }
    S.user = { id:u.uid, nombre:d.nombre || UI.gateNombre || "ADMIN", rol:"admin" }; UI.gateMode = "login";
    conectarDatos(); render();
  }).catch(function(){ UI.gateMode = "login"; UI.gateError = "No se pudo comprobar tu usuario. Revisa tu internet."; firebase.auth().signOut(); renderGate(); });
}
function conectarDatos(){
  var db = S.db;
  S.unsubs.push(db.collection("egresos").onSnapshot(function(snap){ snap.docChanges().forEach(function(ch){ if(ch.type==="removed") delete S.egresos[ch.doc.id]; else S.egresos[ch.doc.id] = Object.assign({}, ch.doc.data(), { id:ch.doc.id }); }); if(!document.querySelector(".overlay")) render(); }, function(e){ console.error("egresos", e); toast("No se pudieron leer los gastos"); }));
  S.unsubs.push(db.doc("control/config").onSnapshot(function(snap){ var d = snap.exists ? snap.data() : null; if(d && Array.isArray(d.categorias) && d.categorias.length) S.categorias = d.categorias.map(String);
    if(d && d.alertas) Object.keys(CONFIG_BASE.alertas).forEach(function(k){ if(d.alertas[k] !== undefined) S.config.alertas[k] = num(d.alertas[k]); });
    if(d && d.metas) Object.keys(CONFIG_BASE.metas).forEach(function(k){ if(d.metas[k] !== undefined) S.config.metas[k] = num(d.metas[k]); });
    if(!document.querySelector(".overlay")) render(); }, function(){}));
  S.unsubs.push(db.collection("cierres").onSnapshot(function(snap){ snap.docChanges().forEach(function(ch){ if(ch.type==="removed") delete S.cierres[ch.doc.id]; else S.cierres[ch.doc.id] = Object.assign({}, ch.doc.data(), { id:ch.doc.id }); }); if(UI.vista==="caja" && !document.querySelector(".overlay")) render(); }, function(){}));
  db.collection("productos").get().then(function(snap){ S.productos = snap.docs.map(function(d){ return Object.assign({}, d.data(), { id:d.id }); }); }).catch(function(){});
  db.collection("usuarios").get().then(function(snap){ S.usuarios = snap.docs.map(function(d){ return Object.assign({}, d.data(), { id:d.id }); }); if(UI.vista==="envivo") vivoRefrescar(); }).catch(function(){});
  cargarAnio(hp.anio, true);
  // Deudas de cualquier año: los cobros de deudas se cuentan por fecha de cobro, aunque la nota sea de otro año.
  S.unsubs.push(db.collection("ventas").where("pagado","==",false).onSnapshot(function(snap){ snap.docChanges().forEach(function(ch){ if(ch.type==="removed"){ db.doc("ventas/"+ch.doc.id).get().then(function(d){ if(d.exists) S.ventas[d.id] = Object.assign({}, d.data(), { id:d.id }); else delete S.ventas[ch.doc.id]; if(!document.querySelector(".overlay")) render(); }).catch(function(){}); } else S.ventas[ch.doc.id] = Object.assign({}, ch.doc.data(), { id:ch.doc.id }); }); if(!document.querySelector(".overlay")) render(); }, function(e){ console.error("deudas", e); }));
}
function cargarAnio(anio, enVivo){
  anio = Number(anio); if(!anio || S.aniosCargados[anio]) return;
  S.aniosCargados[anio] = "cargando";
  var q = S.db.collection("ventas").where("anio","==",anio);
  if(enVivo){
    S.unsubs.push(q.onSnapshot(function(snap){ snap.docChanges().forEach(function(ch){ if(ch.type==="removed") delete S.ventas[ch.doc.id]; else S.ventas[ch.doc.id] = Object.assign({}, ch.doc.data(), { id:ch.doc.id }); }); S.aniosCargados[anio] = true; if(!document.querySelector(".overlay")) render(); }, function(e){ console.error("ventas", e); S.aniosCargados[anio] = false; toast("No se pudieron leer las notas de la app"); }));
  } else {
    q.get().then(function(snap){ snap.docs.forEach(function(d){ S.ventas[d.id] = Object.assign({}, d.data(), { id:d.id }); }); S.aniosCargados[anio] = true; if(!document.querySelector(".overlay")) render(); }).catch(function(){ S.aniosCargados[anio] = false; });
  }
}
function asegurarAnios(){ var r = periodo(), rp = periodoAnterior(r); aniosDe(r).concat(aniosDe(rp)).forEach(function(a){ if(a >= 2020 && a <= hp.anio+1) cargarAnio(a, false); }); }

// ---------- eventos ----------
function closeOverlay(){ document.getElementById("overlay-root").innerHTML = ""; }
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-action]"); if(!t) return;
  var action = t.getAttribute("data-action"), val = t.getAttribute("data-val"), id = t.getAttribute("data-id");
  if(action==="cerrar-overlay"){ if(ev.target.closest("[data-stop]") && t.classList.contains("overlay")) return; closeOverlay(); return; }
  if(action==="vista"){ UI.vista = val; UI.gastosCat = ""; render(); return; }
  if(action==="per-tipo"){ UI.per.tipo = val; if(val==="dia" && !UI.per.dia) UI.per.dia = todayISO(); asegurarAnios(); render(); return; }
  if(action==="tema"){ var nt = temaActual()==="dark" ? "light" : "dark"; lsSet("tema", nt); aplicarTema(nt); render(); return; }
  if(action==="vivo-3d"){ T3.on = !T3.on; lsSet("vista3d", T3.on); window.__vistaAnt = null; render(); return; }
  if(action==="vivo-tv"){ var on = !document.body.classList.contains("tv"); document.body.classList.toggle("tv", on); if(on && document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(function(){}); } else if(!on && document.fullscreenElement){ document.exitFullscreen().catch(function(){}); } setTimeout(vivoLayout, 350); return; }
  if(action==="util-base"){ UI.utilBase = val; lsSet("utilBase", val); render(); return; }
  if(action==="exportar-excel"){ exportarExcel(); return; }
  if(action==="exportar-pdf"){ exportarPdf(); return; }
  if(action==="ver-dia"){ UI.per.tipo = "dia"; UI.per.dia = val; render(); return; }
  if(action==="ir-gastos-cat"){ UI.vista = "gastos"; UI.gastosCat = val; render(); return; }
  if(action==="nuevo-gasto"){ abrirFormGasto(null); return; }
  if(action==="nuevo-gasto-kardex"){ abrirFormGasto(null); var ck = document.getElementById("g-kardex"); if(ck){ ck.checked = true; document.getElementById("g-kardex-campos").style.display = ""; var pr = document.getElementById("g-prod"); if(pr) pr.focus(); } return; }
  if(action==="editar-gasto"){ abrirFormGasto(S.egresos[id]); return; }
  if(action==="g-metodo"){ document.querySelectorAll("#g-metodo .pay-opt").forEach(function(b){ b.classList.toggle("on", b===t); }); return; }
  if(action==="rec-cancelar"){ document.getElementById("recorte-root").innerHTML = ""; return; }
  if(action==="rec-recortar"){ if(!RECORTE.sel){ document.getElementById("rec-msg").textContent = "Primero marque el rectángulo a recortar."; return; } recCargar(recRegion(false)); return; }
  if(action==="rec-leer"){ recLeer(); return; }
  if(action==="rec-usar"){ recUsar(); return; }
  if(action==="rec-monto"){ recAplicarMonto(num(val)); return; }
  if(action==="g-quitar-foto"){ var img = document.getElementById("g-foto-prev"); if(img){ img.src = ""; img.style.display = "none"; } t.remove(); return; }
  if(action==="guardar-gasto"){ guardarGasto(id || ""); return; }
  if(action==="eliminar-gasto"){ eliminarGasto(id, false); return; }
  if(action==="restaurar-gasto"){ eliminarGasto(id, true); return; }
  if(action==="toggle-eliminados"){ UI.verEliminados = !UI.verEliminados; render(); return; }
  if(action==="ver-foto"){ abrirFoto(id); return; }
  if(action==="kardex-detalle"){ abrirKardexDetalle(val); return; }
  if(action==="nuevo-ajuste"){ abrirFormAjuste(); return; }
  if(action==="nuevo-merma"){ abrirFormMerma(); return; }
  if(action==="vivo-demo"){ vivoDemo(); return; }
  if(action==="vivo-pantalla"){ var vc = document.querySelector(".vivo-card"); if(!vc) return; if(document.fullscreenElement){ document.exitFullscreen(); } else if(vc.requestFullscreen){ vc.requestFullscreen().then(function(){ setTimeout(vivoLayout, 300); }).catch(function(){}); } return; }
  if(action==="guardar-merma"){ guardarMerma(); return; }
  if(action==="quitar-mov"){ var mv = S.egresos[id]; if(mv && confirm("¿Quitar este movimiento del Kardex ("+(mv.tipo==="merma"?"merma":"ajuste")+" de "+kgTxt(mv.kardex?mv.kardex.kg:0)+")?")){ eliminarGasto(id, true, true); } return; }
  if(action==="guardar-ajuste"){ guardarAjuste(); return; }
  if(action==="caja-hoy"){ UI.cajaDia = todayISO(); UI.cajaReal = ""; UI.cajaNota = ""; render(); return; }
  if(action==="caja-ver"){ UI.cajaDia = val; UI.cajaReal = ""; UI.cajaNota = ""; render(); return; }
  if(action==="guardar-cierre"){ guardarCierre(); return; }
  if(action==="guardar-metas"){ guardarConfig("metas", { venta:r2(document.getElementById("meta-venta").value), utilidad:r2(document.getElementById("meta-utilidad").value) }); return; }
  if(action==="guardar-alertas"){ guardarConfig("alertas", { cajaDif:r2(document.getElementById("al-caja").value), deudaCliente:r2(document.getElementById("al-deuda").value), stockMin:r2(document.getElementById("al-stock").value) }); return; }
  if(action==="instalar-app"){ if(window.__instalar){ window.__instalar.prompt(); window.__instalar.userChoice.then(function(){ window.__instalar = null; render(); }).catch(function(){}); } return; }
  if(action==="vivo-sonido"){ VIVO.sonido = !VIVO.sonido; lsSet("sonido", VIVO.sonido); if(VIVO.sonido){ vivoAudio(); sonar(); } t.textContent = VIVO.sonido ? "🔊 Sonido: sí" : "🔇 Sonido: no"; return; }
  if(action==="cat-agregar"){ var nv = document.getElementById("cat-nueva").value.trim(); if(!nv) return; if(S.categorias.some(function(c){ return normalizar(c)===normalizar(nv); })){ toast("Esa categoría ya existe"); return; } S.categorias.push(nv); guardarCategorias(); return; }

  if(action==="cat-subir"){ var k = Number(val); if(k <= 0) return; var tmp = S.categorias[k-1]; S.categorias[k-1] = S.categorias[k]; S.categorias[k] = tmp; guardarCategorias(); return; }
  if(action==="cambiar-pass"){ abrirCambiarPass(); return; }
  if(action==="guardar-pass"){ guardarPass(); return; }
  if(action==="cerrar-sesion"){ cerrarSesion(); return; }
  if(action==="gate-nombre"){ UI.gateNombre = val; UI.gateError = ""; renderGate(); return; }
  if(action==="gate-escribir"){ UI.gateEscribir = true; UI.gateError = ""; renderGate(); return; }
  if(action==="gate-otro"){ UI.gateNombre = ""; UI.gateEscribir = false; UI.gateError = ""; renderGate(); return; }

document.addEventListener("submit", function(ev){ if(ev.target && ev.target.id==="gate-form"){ ev.preventDefault(); confirmarLogin(); } });
document.addEventListener("change", function(ev){
  var el = ev.target, id = el.id;
  if(id==="per-anio"){ UI.per.anio = Number(el.value); asegurarAnios(); render(); }
  else if(id==="per-mes"){ UI.per.mes = Number(el.value); render(); }
  else if(id==="per-dia"){ if(el.value){ UI.per.dia = el.value; asegurarAnios(); render(); } }
  else if(id==="per-desde"){ if(el.value){ UI.per.desde = el.value; asegurarAnios(); render(); } }
  else if(id==="per-hasta"){ if(el.value){ UI.per.hasta = el.value; asegurarAnios(); render(); } }
  else if(id==="gastos-cat"){ UI.gastosCat = el.value; render(); }
  else if(id==="caja-dia"){ if(el.value){ UI.cajaDia = el.value; UI.cajaReal = ""; UI.cajaNota = ""; asegurarAnios(); cargarAnio(Number(el.value.slice(0,4)), false); render(); } }
});
document.addEventListener("input", function(ev){
  var el = ev.target, id = el.id;
  if(id==="gastos-buscar"){ UI.gastosBuscar = el.value; var tb = document.querySelector(".main"); clearTimeout(window.__bq); window.__bq = setTimeout(function(){ render(); var b = document.getElementById("gastos-buscar"); if(b){ b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }, 350); }
  else if(id==="caja-real"){ UI.cajaReal = el.value; clearTimeout(window.__cq); window.__cq = setTimeout(function(){ render(); var r = document.getElementById("caja-real"); if(r){ r.focus(); } }, 600); }
  else if(id==="caja-nota"){ UI.cajaNota = el.value; }
});
document.addEventListener("keydown", function(ev){ if(ev.key==="Escape") closeOverlay(); });
document.addEventListener("fullscreenchange", function(){ if(!document.fullscreenElement && document.body.classList.contains("tv")){ document.body.classList.remove("tv"); } setTimeout(function(){ if(typeof vivoLayout==="function") vivoLayout(); }, 300); });
window.addEventListener("online", function(){ S.online = true; if(S.user) render(); });
window.addEventListener("offline", function(){ S.online = false; if(S.user) render(); });

// ---------- inicio ----------
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); window.__instalar = e; if(S.user && UI.vista==="ajustes") render(); });
if("serviceWorker" in navigator && location.protocol !== "file:"){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
function iniciar(){
  if(!window.firebase || !window.RUTIPOLLO_FIREBASE_CONFIG){ document.getElementById("app").innerHTML = '<div class="gate"><h1>'+CFG.titulo+'</h1><div class="note danger">No se pudo cargar la conexión. Revisa tu internet y vuelve a abrir la página.</div></div>'; return; }
  if(!firebase.apps.length) firebase.initializeApp(window.RUTIPOLLO_FIREBASE_CONFIG);
  S.db = firebase.firestore();
  UI.gateMode = "cargando"; renderGate();
  S.db.doc("publico/nombres").onSnapshot(function(snap){ var d = snap.exists ? snap.data() : null; S.nombres = (d && Array.isArray(d.nombres)) ? d.nombres : []; if(!S.user && UI.gateMode==="login") renderGate(); }, function(){});
  S.db.doc("servicio/estado").onSnapshot(function(snap){ S.servicio = snap.exists ? (snap.data()||{}) : {}; if(!S.user) renderGate(); else render(); }, function(){});
  var primero = true;
  firebase.auth().onAuthStateChanged(function(u){
    if(u){ alEntrar(u); }
    else if(primero || S.user){ if(S.user){ S.user = null; } UI.gateMode = "login"; renderGate(); }
    primero = false;
  });
}
iniciar();
})();
